<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dhara Ruparel - Portfolio{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ===== LOADING SCREEN ===== -->
    <div id="loader-overlay">
        <!-- Background grid (matches hero section) -->
        <div class="loader-grid"></div>

        <div class="loader-body">
            <!-- Logo mark — matches nav logo style -->
            <div class="loader-logo">
                <span class="loader-logo-text">DR</span>
                <div class="loader-logo-dot"></div>
            </div>

            <!-- Name + tagline -->
            <div class="loader-name">DHARA RUPAREL</div>
            <div class="loader-tagline">Computer Engineer &amp; AI Enthusiast</div>

            <!-- Progress bar -->
            <div class="loader-bar-wrap">
                <div class="loader-bar-fill"></div>
            </div>
            <div class="loader-status">
                <span class="loader-status-label">INITIALIZING</span>
                <span id="loader-pct">0%</span>
            </div>
        </div>
    </div>

    <style>
        /* ── Loader overlay ─────────────────────────────────── */
        #loader-overlay {
            position: fixed;
            inset: 0;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }
        #loader-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* ── Background grid (same as hero::before) ─────────── */
        .loader-grid {
            position: absolute;
            inset: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="%23ffffff" stroke-width="0.5" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            opacity: 0.15;
            pointer-events: none;
        }

        /* ── Centered content ───────────────────────────────── */
        .loader-body {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            z-index: 1;
        }

        /* ── Logo mark ──────────────────────────────────────── */
        .loader-logo {
            position: relative;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(108, 92, 231, 0.35);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(108, 92, 231, 0.15),
                        inset 0 1px 0 rgba(255,255,255,0.06);
            animation: loader-float 3s ease-in-out infinite;
            margin-bottom: 6px;
        }

        /* Spinning border accent */
        .loader-logo::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 26px;
            background: conic-gradient(
                from 0deg,
                #6c5ce7 0%,
                #a29bfe 25%,
                transparent 50%,
                transparent 100%
            );
            animation: loader-spin 2s linear infinite;
            z-index: -1;
        }
        .loader-logo::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            background: #0a0a0a;
            z-index: -1;
        }

        .loader-logo-text {
            font-family: 'Inter', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, #6c5ce7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Small dot accent — matches nav logo style */
        .loader-logo-dot {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 8px;
            height: 8px;
            background: #6c5ce7;
            border-radius: 50%;
            box-shadow: 0 0 8px #6c5ce7;
            animation: loader-blink 1.4s ease-in-out infinite;
        }

        /* ── Name ───────────────────────────────────────────── */
        .loader-name {
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            color: #ffffff;
            text-transform: uppercase;
        }

        /* ── Tagline ────────────────────────────────────────── */
        .loader-tagline {
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 400;
            color: #888888;
            letter-spacing: 0.06em;
        }

        /* ── Progress bar ───────────────────────────────────── */
        .loader-bar-wrap {
            width: 260px;
            height: 2px;
            background: rgba(108, 92, 231, 0.15);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }
        .loader-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6c5ce7, #a29bfe);
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(108, 92, 231, 0.6);
            transition: width 0.12s ease;
        }

        /* ── Status text ────────────────────────────────────── */
        .loader-status {
            display: flex;
            gap: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        .loader-status-label { color: #555; }
        #loader-pct { color: #6c5ce7; font-weight: 600; }

        /* ── Keyframes ──────────────────────────────────────── */
        @keyframes loader-spin {
            to { transform: rotate(360deg); }
        }
        @keyframes loader-float {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-8px); }
        }
        @keyframes loader-blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.2; }
        }
    </style>

    <script>
        (function () {
            const overlay  = document.getElementById('loader-overlay');
            const bar      = document.querySelector('.loader-bar-fill');
            const pctLabel = document.getElementById('loader-pct');
            let pct = 0;

            const tick = setInterval(function () {
                const step = pct < 70 ? Math.random() * 8 + 4
                           : pct < 88 ? Math.random() * 3 + 1
                           : 0;
                pct = Math.min(pct + step, 90);
                bar.style.width = pct + '%';
                pctLabel.textContent = Math.round(pct) + '%';
                if (pct >= 90) clearInterval(tick);
            }, 120);

            window.addEventListener('load', function () {
                clearInterval(tick);
                pct = 100;
                bar.style.width = '100%';
                pctLabel.textContent = '100%';
                setTimeout(function () {
                    overlay.classList.add('hidden');
                }, 500);
            });
        })();
    </script>
    <!-- ===== END LOADING SCREEN ===== -->

    {% block content %}{% endblock %}
    
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
